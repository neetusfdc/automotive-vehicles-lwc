<template>
    <lightning-card title="Opportunities" icon-name="standard:opportunity">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <div class="filters slds-grid slds-wrap slds-gutters_x-small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        type="search"
                        label="Search by Opportunity Name"
                        placeholder="Search opportunities..."
                        onchange={handleSearch}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                    <lightning-combobox
                        label="Stage"
                        value={selectedStage}
                        options={stageOptions}
                        onchange={handleStageChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                    <lightning-combobox
                        label="Rows per page"
                        value="10"
                        options={pageSizeOptions}
                        onchange={handlePageSizeChange}
                    ></lightning-combobox>
                </div>
            </div>

            <template lwc:if={errorMessage}>
                <div class="slds-var-m-top_small slds-text-color_error" role="alert">{errorMessage}</div>
            </template>

            <div class="table-wrapper slds-is-relative slds-var-m-top_small">
                <template lwc:if={isLoading}>
                    <lightning-spinner alternative-text="Loading opportunities"></lightning-spinner>
                </template>

                <template lwc:if={hasRecords}>
                    <lightning-datatable
                        key-field="id"
                        data={opportunities}
                        columns={columns}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        onsort={handleSort}
                        hide-checkbox-column
                    ></lightning-datatable>
                </template>

                <template lwc:else>
                    <template lwc:if={isLoading}></template>
                    <template lwc:else>
                        <p class="slds-var-p-vertical_medium slds-text-align_center slds-text-color_weak">
                            No opportunities match the current filters.
                        </p>
                    </template>
                </template>
            </div>

            <div class="slds-grid slds-grid_align-spread slds-var-m-top_small">
                <lightning-button
                    label="Previous"
                    icon-name="utility:chevronleft"
                    disabled={isFirstPage}
                    onclick={handlePrevious}
                ></lightning-button>
                <span class="slds-align-middle slds-text-body_small">{pageLabel}</span>
                <lightning-button
                    label="Next"
                    icon-name="utility:chevronright"
                    icon-position="right"
                    disabled={isLastPage}
                    onclick={handleNext}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
